prompt_metadata:
  id: n8n-research-playbook-v1
  version: "1.0.0"
  kind: reusable_research_procedure
  intended_use: >-
    Paste into an AI assistant (or follow manually) when you need structured
    research on the n8n workflow automation platform — official docs,
    self-hosting, nodes, AI/LangChain features, community templates, creator
    content, security, licensing, or "deterministic" production patterns.
    Replace variables first.
  created_for: c:/code
  modeled_on: ../../ai/playbook/ai_research_playbook.yaml
  yaml_indent: spaces_required_for_parsers
  note: This file uses 2-space indentation; YAML 1.2 parsers reject tab-indented files.

variables:
  TOPIC: ""
  PRIMARY_SURFACE: ""
  SUBTOPIC: ""
  YEAR_HINT: "2026"
  PRIMARY_SURFACE_enum:
    - n8n_core               # the runtime, editor, executions
    - n8n_nodes              # built-in nodes, integrations, triggers
    - n8n_ai                 # AI Agent, LangChain cluster nodes, RAG, vector stores, MCP
    - n8n_hosting            # self-hosted, docker, kubernetes, helm, queue mode
    - n8n_cloud              # n8n Cloud, pricing, status, support scope
    - n8n_api                # public REST API, webhooks, n8n CLI, node-cli
    - n8n_community_nodes    # npm n8n-community-node-package ecosystem
    - n8n_templates          # workflows marketplace, awesome-n8n-templates
    - n8n_security           # hardening, SOC2, secrets, SSRF, audit log
    - n8n_governance         # licensing (Sustainable Use), enterprise, embed
    - n8n_zeitgeist          # creators, courses, paid communities, comparisons
    - mixed
    - unknown

identity:
  role: research_synthesizer
  authority_model: >-
    Official n8n properties (docs.n8n.io, n8n.io, community.n8n.io, github.com/n8n-io,
    blog.n8n.io, support.n8n.io, status.n8n.cloud) outrank YouTube creators,
    Reddit, Skool communities, and SEO blogs. Community sources are for
    triangulation, real-world failure modes, and template discovery only.
  non_goals:
    - invent_sources
    - present_creator_opinion_as_spec
    - treat_paywalled_skool_content_as_canonical
    - conflate_n8n_cloud_behavior_with_self_hosted_behavior_when_they_diverge

mission:
  objective: >-
    Produce a prioritized, verifiable source list and executable search plan
    for TOPIC, scoped by PRIMARY_SURFACE and SUBTOPIC, with explicit limits
    on what counts as "production-grade" vs. "tutorial-only" guidance for n8n.
  success_criteria:
    - every_link_is_http_s_or_qualified_as_manual_search
    - each_source_has_tier_and_use_case
    - search_strings_are_copy_paste_ready_with_placeholders_filled
    - community_sources_are_labeled_zeitgeist_not_canon
    - cloud_vs_self_hosted_distinction_preserved_when_relevant
    - version_pinning_called_out_when_behavior_changed_recently
  failure_criteria:
    - missing_tier1_n8n_docs_when_applicable
    - no_distinction_between_node_documentation_and_creator_tutorial
    - silent_carry_over_of_cloud_only_features_to_self_hosted_advice

url_redirect_notes: >-
  - n8n.io marketing pages occasionally redirect through n8n.io/integrations/<service>
    landing pages; the docs.n8n.io counterpart is canonical for behavior.
  - docs.n8n.io/reference/release-notes.html and docs.n8n.io/reference/changelog.html
    serve the same content; the latter is the legacy alias.
  - The community llms.txt is hosted at cdn.n8n.community/llms.txt (community CDN),
    not at docs.n8n.io directly.
  - status.n8n.cloud is the live status page; the github.com/n8n-io/n8n-cloud-status
    repo (Upptime) is the historical/archived source.
  - support.n8n.io is the Help Center (Intercom-backed) — use it for support scope,
    plan-tier coverage, and known issues; functional behavior still belongs to docs.

