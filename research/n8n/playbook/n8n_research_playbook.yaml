    - "path:packages/nodes-base {TOPIC} language:typescript"
    - "path:packages/@n8n/nodes-langchain {TOPIC} language:typescript"
    - "extension:json \"nodes\":\\s*\\[ {TOPIC}"     # workflow exports
    - "filename:.env.example n8n {TOPIC}"
  npm:
    - "https://www.npmjs.com/search?q=keywords:n8n-community-node-package%20{TOPIC}"
    - "https://www.npmjs.com/search?q=n8n-nodes-{TOPIC}"
  youtube:
    - "site:youtube.com {TOPIC} n8n (Nate Herk OR Nick Saraev OR Leon van Zyl OR Productive Dude)"
    - "https://www.youtube.com/@n8n-io/search?query={TOPIC}"
  reddit:
    - "site:reddit.com {TOPIC} n8n (workflow OR webhook OR self-hosted OR queue OR \"AI Agent\")"
  community_forum:
    - "site:community.n8n.io/tag/{PRIMARY_SURFACE_tag} {TOPIC}"
    - "https://community.n8n.io/search?q={TOPIC}%20order%3Alatest"
  structured_user_prompt:
    template: >-
      Role: {role}. Context: n8n {version} on {cloud_or_self_host}, {db_backend},
      {queue_or_main_only}. Task: {one_deliverable}. Format: {output_shape}.
      Quality bar: {tests_via_n8n_cli_or_workflow_export} and pointer to the
      canonical docs.n8n.io page.

decision_procedure:
  - step: 1
    action: fill_variables
    input: TOPIC, PRIMARY_SURFACE, SUBTOPIC, YEAR_HINT
    output: scoped_question_one_paragraph
  - step: 2
    action: open_tier_1
    input: source_registry.tier_1_official scoped to PRIMARY_SURFACE (or "mixed")
    output: list_of_5_to_10_canonical_pages_to_read_first
    must_include_when_relevant:
      - the docs.n8n.io page that matches PRIMARY_SURFACE
      - the corresponding github.com/n8n-io repo
      - the relevant community.n8n.io tag
      - release-notes.html if the question mentions "since" / "broken" / "regressed"
      - faircode-license if the question is commercial / embed / resale
  - step: 3
    action: run_search_templates
    input: search_templates.web + search_templates.github_code (always); add npm if
           PRIMARY_SURFACE in [n8n_community_nodes, n8n_nodes]; add youtube if
           SUBTOPIC implies tutorial; add community_forum always
    output: ranked_hit_list_with_title_url_and_why
  - step: 4
    action: triangulate
    input: at_most_two tier_3 sources (creator video OR Reddit thread OR HN post)
           for failure_modes_or_workarounds
    output: separate_section_labeled_zeitgeist
  - step: 5
    action: resolve_conflicts
    rules:
      - docs.n8n.io_wins_over_blog_n8n_io_when_they_disagree
      - blog_n8n_io_wins_over_creator_youtube
      - n8n_cloud_behavior_must_not_be_quoted_for_self_hosted_questions_without_a_caveat
      - if_release_notes_show_a_change_after_creator_video_publish_date_then_video_is_stale
    output: state_winner_and_why
  - step: 6
    action: emit_output_contract
    validation: all links reachable_or_marked_unknown
    on_failure: mark UNKNOWN and remove claim

output_contract:
  format: markdown
  sections:
    - title: Scoped question
    - title: Tier 1 sources consulted
      fields:
        - name: url
        - name: what_you_extracted
        - name: cloud_vs_self_hosted_applicability
    - title: Curated lists, repos, MCP, or templates (if any)
    - title: Community zeitgeist (clearly labeled, optional)
      must_include:
        - source_type: [reddit_thread, youtube_video, hn_post, skool_post, blog_post]
        - publication_date_or_marked_undated
    - title: Copy-paste search strings used
    - title: Version/hosting caveats
      content: list of "applies to n8n {x.y}+" and "self-hosted only" / "cloud only" notes
    - title: Gaps and UNKNOWNs
  decision_trace_required: true
  forbidden:
    - unsourced_strong_claims
    - single_youtube_video_as_definitive
    - quoting_skool_paywalled_content_without_marking_it_paywalled
    - presenting_npm_keyword_search_hit_as_endorsed_by_n8n

validation_gates:
  - gate: G1
    check: at_least_one_docs_n8n_io_url_when_PRIMARY_SURFACE_is_known
  - gate: G2
    check: tier_3_content_is_labeled_zeitgeist_and_dated_or_marked_undated
  - gate: G3
    check: cloud_vs_self_hosted_distinction_explicit_for_hosting_security_or_pricing_topics
  - gate: G4
    check: community_node_recommendations_link_to_npm_AND_to_a_repo_or_author
  - gate: G5
    check: license_or_resale_advice_cites_docs.n8n.io/faircode-license_or_LICENSE.md

acknowledgment_protocol:
  if_topic_ambiguous: ask_one_clarifying_block_max_five_bullets
  if_sources_conflict: report_conflict_and_cite_both_with_dates
  if_only_creator_content_exists:
    action: report_zeitgeist_only_and_recommend_filing_a_community_forum_thread
    forbidden: presenting_creator_content_as_canon

examples:

  positive:
    - variables:
        TOPIC: "queue mode with separate workers and Redis on Kubernetes"
        PRIMARY_SURFACE: n8n_hosting
        SUBTOPIC: "production scaling for >50K executions/day"
      expected_first_move: >-
        Open docs.n8n.io/hosting/scaling/queue-mode/ and the official Helm chart
        repo (github.com/n8n-io/n8n-helm-chart), then n8n-io/n8n-hosting for the
        canonical kubernetes/ manifests, then community.n8n.io tag deployment
        for real-world failure modes. renezander.com self-hosting guide is
        permitted as a single tier-3 cross-check.

    - variables:
        TOPIC: "AI Agent node that uses MCP tools from a local server"
        PRIMARY_SURFACE: n8n_ai
        SUBTOPIC: "Cursor-driven workflow authoring"
      expected_first_move: >-
        Open docs.n8n.io/integrations/builtin/cluster-nodes/root-nodes/n8n-nodes-langchain.agent/
        + docs.n8n.io/advanced-ai/langchain/langchain-n8n, then czlonkowski/n8n-mcp
        for the AI-assistant side, then community.n8n.io tag ai for known issues.

    - variables:
        TOPIC: "publishing a community node to npm"
        PRIMARY_SURFACE: n8n_community_nodes
        SUBTOPIC: "verification + Cloud eligibility"
      expected_first_move: >-
        Open docs.n8n.io/integrations/community-nodes/build-community-nodes,
        docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes,
        docs.n8n.io/integrations/creating-nodes/build/n8n-node/, plus
        github.com/n8n-io/n8n-nodes-starter; verify naming convention by
        searching npm for keyword n8n-community-node-package.

  negative:
    - description: Citing a Nate Herk YouTube video as the spec for AI Agent max-iterations behavior
      expected: reject_or_downrank_use_docs.n8n.io_AI_Agent_node_page
    - description: Recommending `latest` Docker tag in a "production self-hosting" answer
      expected: reject_violates_determinism_note_pin_a_concrete_minor_version
    - description: Quoting an n8n Cloud-only feature (e.g. native AI Assistant) when the user said "self-hosted"
      expected: reject_violates_G3_or_caveat_explicitly

  edge:
    - description: PRIMARY_SURFACE is unknown (user just said "I want to use n8n for X")
      expected: start_from_mixed_tier_1_set (homepage + docs root + community + n8n.io/workflows) then narrow
    - description: User asks whether they can resell a hosted n8n SaaS to their customers
      expected: open docs.n8n.io/faircode-license + LICENSE.md + LICENSE_EE.md, then blog Sustainable Use License post; G5 enforced
    - description: Question references a behavior that "broke last week"
      expected: open release-notes.html and github.com/n8n-io/n8n/releases first; bisect by version
