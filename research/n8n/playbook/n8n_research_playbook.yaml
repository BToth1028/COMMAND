determinism_note: >-
  For n8n, treat "production-grade" as: pinned image tag (e.g. n8nio/n8n:1.x.y,
  not :latest), workflows exported as JSON and committed to git (use the
  source-control feature on Enterprise, or @n8n/cli + `workflow get` in CI),
  Postgres backing store with backups (never SQLite in prod), queue mode with
  a separate worker fleet for >50K executions/day, environment-variable-driven
  config (no UI-only secrets), task runners enabled (default since n8n 2.0),
  and explicit Publish (not autosave) gating production deployments. Pin the
  major version when reading docs — release-notes show ~weekly minor releases
  and node behavior has changed across 1.x → 2.x.

