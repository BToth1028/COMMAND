# ============================================================================
# CONTEXT BOOTSTRAP TEMPLATE — COPY FOR EVERY NEW SESSION
# ============================================================================
# File naming:  {ProjectName}_YYMMDD-HHMM.yaml — America/New_York local time
# Timestamp:    session END time (filename + session.id finalized at session end)
# Live path:    {project_root}/02_working/chat-sessions/bootstrap/
# Archive path: {project_root}/02_working/chat-sessions/bootstrap/_ar/  # DEFERRED per COMMAND.md archive_housekeeping
# project_root: absolute path supplied by operator at session start
# ----------------------------------------------------------------------------
# Decisions are session-scoped. They are NOT carried forward into future
# bootstraps. A bootstrap documents only what its session did. Long-term
# decision archival is corpus responsibility, not bootstrap responsibility.
# ----------------------------------------------------------------------------
# Recovery-generated supplemental bootstraps set top-level supplemental: true
# and supersedes: <broken_session_id>. Naming: {ProjectName}_{BrokenID}S.yaml
# ============================================================================

project:
  name: ""
  summary: ""
  scope: ""
  non_scope: ""

session:
  id: ""                          # YYMMDD-HHMM, America/New_York local time, matches filename
  timezone: "America/New_York"    # IANA zone — applies to id, filename, started, ended
  started: ""                     # ISO 8601 with offset, e.g. 2026-04-16T14:30:00-04:00
  ended: ""                       # ISO 8601 with offset, e.g. 2026-04-16T16:45:00-04:00 — populated at finalization only
  session_summary: ""             # 2-4 sentences — written at finalization

# Populated only at bootstrap-finalize. Required on every finalized bootstrap on disk.
# Dropped by bootstrap-init when opening the next session (fresh block written at next finalize).
# Purpose: zero-context kickoff for Path 1 — operator copy-paste, truth anchors, read order, gates.
next_session_kickoff:
  bootstrap_file_absolute: ""     # absolute path of THIS bootstrap file (the one just written)
  project_root: ""                # mirrors project storage root
  project_name: ""                # mirrors project.name / filename stem convention
  path_1_operator_template: ""    # paste-ready lines: @path + one-sentence execute intent for bootstrap-start Path 1
  frozen_intent: []                 # non-negotiable bullets for the next agent
  truth_anchors:
    command_md: ""                # e.g. C:/Users/.../commands/bootstrap/COMMAND.md
    schema_yaml: ""               # e.g. sibling schema.yaml
    validate_script: ""           # validate_bootstrap.py path or "" if unused
    extra: []                      # other authoritative paths (charters, routers, skills)
  read_first: []                  # ordered paths before touching project work; must include command_md + this bootstrap path
  assumptions_next_session_must_hold: []
  known_gaps: []                  # task ids, issues, or explicit unfinished scope
  do_not_request_from_operator_unless: []  # halt-only prompts; default seamless Path 1

# Optional top-level fields for recovery-generated supplemental bootstraps.
# Omit entirely (do NOT set to false / null) for normal session bootstraps.
# supplemental: true              # boolean — present only when generated by recovery flow
# supersedes: ""                  # session_id of broken bootstrap this supplemental replaces

tasks:
  - id: ""                        # T-001, T-002, etc. (no reuse within a session)
    title: ""                     # imperative verb phrase
    status: ""                    # enum: ACTIVE | DONE | BLOCKED | DEFERRED | CANCELLED
    session_origin: ""            # session ID where first created
    session_completed: null       # session ID where DONE or CANCELLED (null otherwise)
    priority: ""                  # enum: HIGH | MEDIUM | LOW (optional but recommended)
    description: ""               # enough for a zero-context agent to execute
    blockers: null                # for BLOCKED: what prevents progress
    deferred_reason: null         # for DEFERRED: why, and reactivation conditions
    cancelled_reason: null        # for CANCELLED: why it was dropped
    notes: null                   # optional: accumulated context

# Decisions are session-scoped (NOT carried forward across bootstraps).
# Only decisions made during THIS session belong here.
decisions:
  - id: ""                        # D-001, D-002, etc. (within-session unique)
    session_origin: ""            # session ID where decided (will equal current session.id)
    domain: ""                    # area affected (database, UI, architecture, naming, etc.)
    outcome: ""                   # what was decided
    rationale: ""                 # WHY — must pass Zero-Context Test
    supersedes: null              # ID of prior decision this replaces, or named corpus artifact (null if novel)

environment:
  tools: []                       # software, frameworks, languages in active use
  key_paths: []                   # file paths, DBs, output dirs relevant to current work
  schema_state: null              # optional: current DB schemas, APIs, data models
  dependencies: null              # optional: external deps, services, accounts
  notes: null                     # optional: anything else environment-related

context_file_audit:
  - filename: ""                  # absolute path or path relative to workspace root
    status: ""                    # enum: CURRENT | STALE | NEEDS_UPDATE | DUPLICATE
    note: null                    # why flagged, or what needs updating

issues:                           # optional section
  - id: ""                        # I-001, I-002, etc.
    summary: ""                   # what the issue is
    severity: ""                  # enum: HIGH | MEDIUM | LOW
    session_origin: ""            # when first identified
    resolution: null              # how resolved (null if open)
